    excluded_skills: [difficult-workplace-conversation, work-message-writing]
  - name: workplace-difficult-conversation
    profile: workplace
    prompt: 同事连续越过我承诺排期，我想当面说明边界但不激化冲突。
    expected_skills: [difficult-workplace-conversation]
    excluded_skills: [status-reporting, work-message-writing]
  - name: parenting-development
    profile: parenting
    prompt: 两岁孩子通常有哪些语言发展表现，我应该观察什么？
