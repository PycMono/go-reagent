    expected_skills: [maintenance-planning]
    excluded_skills: [vehicle-comparison, vehicle-symptom-triage]
  - name: automotive-combined
    profile: automotive
    prompt: 二手车试驾发现异响，帮我比较候选车辆并整理检测和后续保养清单。
    expected_skills: [vehicle-comparison, vehicle-symptom-triage, maintenance-planning]
    excluded_skills: []
  - name: workplace-message
    profile: workplace
    prompt: 帮我写一条向同事确认交付时间的企业微信消息，语气礼貌但明确。
