version: 1
cases:
  - name: general-greeting
    profile: general
    prompt: 你好，今天心情怎么样？
    expected_skills: []
    excluded_skills: [decision-support, learning-explanation, weather-assistance, writing-assistance]
  - name: general-weather
    profile: general
    prompt: 上海明天会下雨吗？出门要带伞吗？
    expected_skills: [weather-assistance]
    excluded_skills: [decision-support, learning-explanation, writing-assistance]
  - name: writing-social-content
    profile: writing
    prompt: 帮我写一篇分享儿童春季穿搭的小红书文案。
    expected_skills: [social-content]
    excluded_skills: [long-form-structure, rewrite-and-polish]
  - name: writing-rewrite
    profile: writing
    prompt: 把这段通知改得更温和、更精简，事实不要变。
    expected_skills: [rewrite-and-polish]
    excluded_skills: [long-form-structure, social-content]
  - name: writing-long-form
    profile: writing
    prompt: 帮我设计一篇三千字行业分析文章的论点和大纲。
    expected_skills: [long-form-structure]
    excluded_skills: [rewrite-and-polish, social-content]
  - name: learning-concept
    profile: learning
    prompt: 用初中生能理解的方式解释什么是机会成本。
    expected_skills: [concept-explanation]
    excluded_skills: [practice-design, study-planning]
  - name: learning-practice
    profile: learning
    prompt: 围绕一元二次方程给我出五道由易到难的练习并附答案。
    expected_skills: [practice-design]
    excluded_skills: [concept-explanation, study-planning]
  - name: learning-plan
    profile: learning
    prompt: 我六周后考英语四级，每天一小时，帮我安排学习计划。
    expected_skills: [study-planning]
    excluded_skills: [concept-explanation, practice-design]
  - name: health-symptoms
    profile: health
    prompt: 最近三天反复头晕，我应该记录哪些情况方便判断变化？
    expected_skills: [symptom-organizing]
    excluded_skills: [care-visit-preparation, health-report-explanation]
  - name: health-report
    profile: health
    prompt: 体检报告里的谷丙转氨酶偏高是什么意思？
    expected_skills: [health-report-explanation]
    excluded_skills: [care-visit-preparation, symptom-organizing]
  - name: health-visit
    profile: health
    prompt: 明天第一次去心内科，我需要带什么资料、问医生什么？
    expected_skills: [care-visit-preparation]
    excluded_skills: [health-report-explanation, symptom-organizing]
  - name: health-combined
    profile: health
    prompt: 我胸闷两天且心电图提示异常，下午去医院，帮我整理症状和就医问题。
    expected_skills: [symptom-organizing, health-report-explanation, care-visit-preparation]
    excluded_skills: []
  - name: legal-facts
    profile: legal
    prompt: 帮我把这次租房押金纠纷按时间线整理事实和证据缺口。
    expected_skills: [facts-and-evidence-organizing]
    excluded_skills: [contract-clause-analysis, legal-consultation-preparation]
  - name: legal-contract
    profile: legal
    prompt: 帮我分析合同里自动续约和提前解约条款分别有什么风险。
    expected_skills: [contract-clause-analysis]
    excluded_skills: [facts-and-evidence-organizing, legal-consultation-preparation]
  - name: legal-consultation
    profile: legal
    prompt: 我准备咨询律师劳动争议，应该带哪些材料、重点问什么？
    expected_skills: [legal-consultation-preparation]
    excluded_skills: [contract-clause-analysis, facts-and-evidence-organizing]
  - name: legal-combined
    profile: legal
    prompt: 明天咨询律师，帮我整理合同争议的时间线、争议条款和问题清单。
    expected_skills: [facts-and-evidence-organizing, contract-clause-analysis, legal-consultation-preparation]
    excluded_skills: []
  - name: automotive-comparison
    profile: automotive
    prompt: 一家四口市区通勤兼周末露营，帮我比较这两款车怎么选。
