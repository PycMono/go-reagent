# 基础设施告警；Agent 业务状态与用量通过 Trace 和调用账本排查。
groups:
  - name: reagent.pipeline
    interval: 30s
    rules:
      - alert: ReagentCollectorDroppingSpans
        expr: sum(rate(otelcol_receiver_refused_spans_total[5m])) > 0
        for: 5m
        labels: {severity: critical}

      - alert: ReagentMetricsScrapeFailing
        expr: up{job="go-reagent"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Prometheus 连续 3 次抓取应用 Metrics Endpoint 失败"
