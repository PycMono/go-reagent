{{ define "layout" }}base{{ end }}
{{ define "head" }}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="选择一个 Agent 开始对话">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/pages/agents.css">
{{ end }}
{{ define "content" }}
<div class="agent-directory">
  <aside class="agent-directory__rail" aria-label="主导航">
    <a class="agent-directory__brand" href="/agents" aria-label="Reagent Agent 目录">
      <span class="agent-directory__brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>Reagent</span>
    </a>
    <nav class="agent-directory__nav">
      <a class="is-current" href="/agents" aria-current="page">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
        <span>Agent 目录</span>
      </a>
      <a href="/chat">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 18.5 3.8 21l3.9-1.2c1.2.6 2.7.9 4.3.9 5 0 9-3.7 9-8.3S17 4 12 4s-9 3.7-9 8.4c0 2.4 1 4.5 2 6.1Z"/></svg>
        <span>聊天</span>
      </a>
    </nav>
    <p class="agent-directory__rail-note">选择由组织发布的 Agent，首条消息发送后才会建立会话。</p>
  </aside>

  <main class="agent-directory__main">
    <header class="agent-directory__header">
      <div>
        <h1>选择 Agent</h1>
        <p>按名称或用途查找，明确选择后进入新对话。</p>
      </div>
      <span class="agent-directory__tenant" id="tenantLabel" hidden></span>
    </header>

    <section class="agent-directory__toolbar" aria-label="搜索 Agent">
      <form class="agent-search" id="agentSearchForm" role="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <label class="sr-only" for="agentSearch">搜索 Agent</label>
        <input id="agentSearch" type="search" placeholder="搜索名称或用途" autocomplete="off" maxlength="120">
        <button id="clearAgentSearch" type="button" aria-label="清除搜索" title="清除搜索" hidden>×</button>
      </form>
      <p class="agent-directory__count" id="agentCount" aria-live="polite"></p>
    </section>

    <section class="agent-directory__results" aria-labelledby="agentResultsTitle">
      <h2 class="sr-only" id="agentResultsTitle">Agent 搜索结果</h2>
      <div class="agent-state" id="agentLoading" role="status">
        <span class="agent-state__spinner" aria-hidden="true"></span>
        <p>正在加载 Agent</p>
      </div>
      <div class="agent-state" id="agentError" role="alert" hidden>
        <strong>Agent 列表加载失败</strong>
        <p id="agentErrorMessage">请检查连接后重试。</p>
        <button id="retryAgents" type="button">重新加载</button>
      </div>
      <div class="agent-state" id="agentEmpty" hidden>
        <strong id="agentEmptyTitle">还没有可用的 Agent</strong>
        <p id="agentEmptyMessage">管理员发布 Agent 后会显示在这里。</p>
      </div>
      <div class="agent-list" id="agentList" aria-live="polite"></div>
      <button class="agent-directory__load-more" id="loadMoreAgents" type="button" hidden>加载更多</button>
    </section>
  </main>
</div>
{{ end }}
{{ define "scripts" }}<script type="module" src="/static/js/pages/agents.js"></script>{{ end }}
