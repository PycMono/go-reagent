{{ define "layout" }}base{{ end }}
{{ define "content" }}
<div class="qb-chat__layout">
  {{ template "conversation-sidebar" . }}
  <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭会话列表" tabindex="-1"></button>

  <main class="qb-chat__main" id="chatMain">
    <header class="qb-chat__top-bar" id="chatHeader">
      <button class="icon-button mobile-menu" id="sidebarOpen" type="button" aria-label="打开会话列表">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="qb-chat__session-heading">
        <span class="qb-chat__session-kicker">WORKSPACE AGENT</span>
        <div class="qb-chat__session-line">
          <h1 class="qb-chat__session-title" id="sessionTitle">新对话</h1>
          <span class="qb-chat__session-profile" id="sessionProfile" hidden></span>
        </div>
      </div>
      <div class="qb-chat__header-state" title="服务已连接">
        <span class="status-beacon" aria-hidden="true"></span><span>Local</span>
      </div>
    </header>

    <section class="qb-chat__messages" id="chatMessages" aria-live="polite" aria-label="聊天消息">
      <div class="qb-chat__welcome" id="chatWelcome">
        <div class="qb-chat__welcome-mark" aria-hidden="true"><span id="welcomeProfileIcon">R</span></div>
        <p class="qb-chat__welcome-kicker">选择适合这次对话的助手</p>
        <h2 id="profileWelcomeTitle">正在加载助手</h2>
        <p class="qb-chat__welcome-description" id="profileWelcomeDescription">每个对话会固定使用创建时选择的助手。</p>
        <p class="qb-chat__profile-error" id="profileLoadError" role="status" hidden>助手列表暂时无法加载，请刷新页面后重试。</p>
        <div class="qb-chat__profile-picker" id="profilePicker" role="listbox" aria-label="选择助手"></div>
        <div class="qb-chat__profile-starters" id="profileStarters" aria-label="推荐问题"></div>
      </div>
    </section>

    <div class="qb-chat__activity-shell" id="runStatus" role="status" aria-live="polite" hidden></div>

    <div class="qb-chat__input-bar">
      <button class="older-messages" id="loadOlderMessages" type="button" hidden>查看更早消息</button>
      <form class="qb-chat__composer" id="chatComposer">
        <label class="sr-only" for="chatInput">发送消息</label>
        <textarea class="qb-chat__input" id="chatInput" rows="1" maxlength="12000" placeholder="给 Reagent 发消息" aria-describedby="composerHint"></textarea>
        <button class="qb-chat__send" id="sendBtn" type="submit" aria-label="发送消息">
          <svg class="send-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
          <svg class="stop-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </form>
      <p class="qb-chat__composer-hint" id="composerHint">Enter 发送 · Shift + Enter 换行 · 回复与工具记录会保存到 MySQL</p>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="alert" hidden></div>
{{ end }}
